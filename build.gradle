plugins {
	id 'java-library'
	id 'jacoco'
	id 'maven-publish'
	id 'me.champeau.jmh' version '0.7.3'
	id 'com.diffplug.spotless' version '8.10.0'
	id 'name.remal.sonarlint' version '7.1.6'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
	withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
	options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(Javadoc).configureEach {
	dependsOn classes
	source = sourceSets.main.allJava.matching {
		exclude 'module-info.java'
		exclude '**/internal/**'
	}
	classpath = files(sourceSets.main.output.classesDirs) + sourceSets.main.compileClasspath
	modularity.inferModulePath = false
	options.encoding = 'UTF-8'
	options.addBooleanOption('Xdoclint:all', true)
}

dependencies {
	testImplementation platform('org.junit:junit-bom:6.0.1')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jmh {
	jmhVersion = '1.37'
	warmupIterations = 3
	iterations = 5
	fork = 2
	timeUnit = 'ns'
	benchmarkMode = ['avgt']
	resultFormat = 'JSON'
	resultsFile = layout.buildDirectory.file('reports/jmh/results.json').get().asFile
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	testLogging {
		events 'failed', 'skipped'
		exceptionFormat = 'full'
	}
}

spotless {
	lineEndings = com.diffplug.spotless.LineEnding.UNIX
	java {
		target 'src/**/*.java'
		palantirJavaFormat('2.97.0').formatJavadoc(true)
		formatAnnotations()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	groovyGradle {
		greclipse()
		trimTrailingWhitespace()
		endWithNewline()
	}
	format 'misc', {
		target '*.md', '*.properties', '.gitignore'
		trimTrailingWhitespace()
		endWithNewline()
	}
}

jacoco {
	toolVersion = '0.8.14'
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.90
			}
			limit {
				counter = 'BRANCH'
				minimum = 0.75
			}
		}
	}
}

check {
	dependsOn spotlessCheck
	dependsOn jacocoTestCoverageVerification
	finalizedBy jacocoTestReport
}

tasks.register('quality') {
	group = 'verification'
	description = 'Runs formatting checks, tests, Javadoc, coverage verification, and SonarLint.'
	dependsOn check
	dependsOn javadoc
	dependsOn tasks.matching { task ->
		task.name.toLowerCase(Locale.ROOT).startsWith('sonarlint')
		&& !task.name.toLowerCase(Locale.ROOT).contains('properties')
		&& !task.name.toLowerCase(Locale.ROOT).contains('rules')
	}
}

publishing {
	publications {
		library(MavenPublication) {
			from components.java
			artifactId = 'event-framework'
		}
	}
}
